
name: Weekly PKGBUILD Release

on:
  schedule:
    # Every Monday at 00:00 UTC
    - cron: "0 0 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install system tools
      - name: Install system tools
        run: |
          pacman -Syu --noconfirm

          pacman -S --needed --noconfirm \
            base-devel \
            git \
            sudo

      # 3. Create builder user and configure sudo
      - name: Create builder user
        run: |
          useradd -m -s /bin/bash builder

          # Disable password authentication
          passwd -l builder

          # Enable passwordless root access through sudo
          echo "builder ALL=(ALL:ALL) NOPASSWD: ALL" \
            > /etc/sudoers.d/builder

          chmod 440 /etc/sudoers.d/builder

          # Validate sudo configuration
          visudo -cf /etc/sudoers.d/builder

          # Give builder ownership of workspace
          chown -R builder:builder "$GITHUB_WORKSPACE"

          # Verify sudo access
          su - builder -c "sudo -n whoami"

      # 4. Install dependencies and build package
      - name: Build PKGBUILD
        run: |
          su - builder -c "
            cd '$GITHUB_WORKSPACE'

            echo '================================'
            echo 'Builder user:'
            whoami

            echo 'Sudo verification:'
            sudo -n whoami

            echo '================================'
            echo 'Installing dependencies...'

            makepkg -sif

            echo '================================'
            echo 'Build completed!'
          "

      # 5. Prepare release files as builder
      - name: Prepare release files
        run: |
          su - builder -c "
            cd '$GITHUB_WORKSPACE'

            mkdir -p release

            find . -maxdepth 1 -type f \
              \( \
                -name '*.pkg.tar.zst' \
                -o -name '*.pkg.tar.xz' \
              \) \
              -exec cp {} release/ \;

            echo 'Generated packages:'
            ls -lh release/

            if [ -z \"\$(ls -A release)\" ]; then
              echo 'ERROR: No packages generated!'
              exit 1
            fi
          "

      # 6. Generate weekly release tag
      - name: Generate release tag
        id: tag
        run: |
          TAG="weekly-$(date -u +'%Y-%m-%d')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 7. Publish GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Weekly Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Automatic Weekly Build

            Package: Calamares

            Build date: ${{ github.run_started_at }}

            Source commit: ${{ github.sha }}

            Built on Arch Linux using builder account.
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
