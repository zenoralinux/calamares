
name: Weekly PKGBUILD Release

on:
  schedule:
    - cron: "0 0 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            git

      - name: Create build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      # Install dependencies as root
      - name: Install PKGBUILD dependencies
        run: |
          cd "$GITHUB_WORKSPACE"

          source ./PKGBUILD

          DEPS=(
            "${depends[@]}"
            "${makedepends[@]}"
            "${checkdepends[@]}"
          )

          if [ "${#DEPS[@]}" -gt 0 ]; then
            pacman -S --needed --noconfirm "${DEPS[@]}"
          fi

      # Build without sudo or dependency installation
      - name: Build package
        run: |
          su builder -c "
            cd '$GITHUB_WORKSPACE'
            makepkg -f --noconfirm --cleanbuild --nodeps
          "

      - name: Prepare release files
        run: |
          mkdir -p release

          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
            \( -name '*.pkg.tar.zst' -o -name '*.pkg.tar.xz' \) \
            -exec cp {} release/ \;

          if [ -z "$(ls -A release)" ]; then
            echo "ERROR: No package files generated!"
            exit 1
          fi

          ls -lh release/

      - name: Generate release tag
        id: tag
        run: |
          TAG="weekly-$(date -u +'%Y-%m-%d')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Weekly Release ${{ steps.tag.outputs.tag }}
          body: |
            ## Automatic Weekly Build

            Package: Calamares
            Build date: ${{ github.run_started_at }}
            Commit: ${{ github.sha }}

          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
